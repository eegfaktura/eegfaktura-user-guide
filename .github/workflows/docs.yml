name: User Guide (MkDocs)

# Builds the end-user guide with MkDocs and publishes the static site to this
# repository's `gh-pages` branch (GitHub Pages: Settings → Pages → branch
# gh-pages, folder /). Same pattern as the member-onboarding user guide.
#
# scan + build run for pull requests and main with a read-only token; only
# deploy (push to main, after both passed) gets write access. No checkout keeps
# its token in .git/config (persist-credentials: false).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-mkdocs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Same scanner versions and checksums as eegfaktura-web's security scan.
  TRIVY_VERSION: '0.75.0'
  TRIVY_SHA256: 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f'
  OSV_SCANNER_VERSION: '2.6.0'
  OSV_SCANNER_SHA256: 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108'

jobs:
  scan:
    name: Vulnerable dependencies (Trivy + OSV-Scanner)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install scanners (pinned, checksum verified)
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSLo trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          curl -fsSLo osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          mkdir -p bin
          tar -xzf trivy.tar.gz -C bin trivy
          install -m 0755 osv-scanner bin/osv-scanner
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Trivy (requirements, HIGH and CRITICAL fail)
        # Trivy only recognises a file named requirements.txt, so each file is scanned from its own folder;
        # a scan that found no packages fails instead of passing silently.
        run: |
          set -e
          for f in requirements-docs.txt requirements-screenshots.txt; do
            d="$RUNNER_TEMP/trivy-${f%.txt}"; mkdir -p "$d"; cp "$f" "$d/requirements.txt"
            trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignorefile "" --no-progress               --format json --output "$d.json" "$d"
            trivy convert --format table "$d.json"
            n=$(jq '[.Results[]? | .Packages[]?] | length' "$d.json")
            if [ "$n" -eq 0 ]; then n=$(jq '[.Results[]?] | length' "$d.json"); fi
            [ "$n" -gt 0 ] || { echo "::error::Trivy found no packages in $f"; exit 1; }
          done

      - name: OSV-Scanner (requirements, any known vulnerability fails)
        # --no-resolve: the files are fully pinned; without it OSV-Scanner resolves the declared dependencies
        # itself and scans packages that are deliberately not installed (requests, see EXTERNAL_SOURCES.md).
        run: osv-scanner scan source --no-resolve --lockfile requirements-docs.txt --lockfile requirements-screenshots.txt

  build:
    name: Build MkDocs (strict)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs dependencies
        run: pip install --no-deps -r requirements-docs.txt

      - name: Build site (strict mode)
        # --strict turns every warning into an error (broken links, missing images).
        run: mkdocs build --strict

  deploy:
    name: Publish to gh-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push to gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Build site
        run: |
          pip install --no-deps -r requirements-docs.txt
          mkdocs build --strict

      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir gh-pages && cd gh-pages
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then git reset -q --hard FETCH_HEAD; fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'CNAME' -exec rm -rf {} +
          cp -r ../site/. .
          touch .nojekyll
          git config user.name "Docs Deploy Bot"
          git config user.email "docs-bot@vfeeg.org"
          git add -A
          if git diff --cached --quiet; then echo "No changes — nothing to deploy."; exit 0; fi
          git commit -q -m "Deploy user guide @ ${GITHUB_SHA:0:7}"
          git push origin HEAD:gh-pages
